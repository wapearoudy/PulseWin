[package]
name = "pulsewin"
version = "0.1.13"
description = "Windows tray monitor for AI coding tool quota"
authors = ["PulseWin contributors"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "pulsewin_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "native-tls", "gzip", "socks"] }
anyhow = "1"
thiserror = "2"
dirs = "5"
chrono = { version = "0.4", features = ["serde"] }
tokio-util = "0.7"
futures = "0.3"
rusqlite = { version = "0.32.1", features = ["bundled", "hooks"] }
tauri-plugin-updater = { version = "2", default-features = false, features = ["native-tls", "zip"] }
semver = "1"
zstd = { version = "0.13", default-features = false }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"

# Read the Windows system proxy out of the registry. reqwest only honours
# HTTP_PROXY/HTTPS_PROXY, which most Windows users never set.
[target.'cfg(windows)'.dependencies]
winreg = "0.55"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true

# MSVC's C debug-record writer can fail in inherited Windows integrity contexts
# (D8050). Keep Rust debug information; the bundled SQLite C library needs none.
[profile.dev.package.libsqlite3-sys]
debug = false

[profile.dev.package.zstd-sys]
debug = false
