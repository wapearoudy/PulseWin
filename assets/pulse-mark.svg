<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="pulseGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="256" height="256" rx="56" fill="#10121b"/>

  <!-- Ring gauge, echoing the panel's usage ring. -->
  <circle cx="128" cy="128" r="72" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="20"/>
  <circle cx="128" cy="128" r="72" fill="none" stroke="url(#pulseGrad)" stroke-width="20"
          stroke-linecap="round" stroke-dasharray="327 452"
          transform="rotate(-90 128 128)"/>

  <!-- Pulse trace through the middle. -->
  <path d="M62 128 H96 L110 100 L128 158 L146 118 L158 128 H194"
        fill="none" stroke="#ffffff" stroke-width="11"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
